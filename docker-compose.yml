services:
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - storefront
      - medusa
      - agent

  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: "admin123$"
      POSTGRES_DB: medusa
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always

  medusa:
    build: ./agentic-store
    restart: always
    depends_on:
      - postgres
      - redis
    ports:
      - "9001:9001"
    env_file: ./agentic-store/.env.production
    volumes:
      - medusa_uploads:/app/.medusa/server/.uploads

  storefront:
    build: ./agentic-store-storefront
    restart: always
    depends_on:
      - medusa
    environment:
      - HOSTNAME=0.0.0.0
    env_file: ./agentic-store-storefront/.env.production

  agent:
    build: ./agent-service
    restart: always
    depends_on:
      - medusa
    env_file: ./agent-service/.env.production
    volumes:
      - agent_uploads:/app/src/uploads
      - agent_db:/app

volumes:
  postgres_data:
  medusa_uploads:
  agent_uploads:
  agent_db:
